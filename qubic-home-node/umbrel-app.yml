releaseNotes: |-
  Version 1.2.11 – polite to public APIs:
   - Fixed: the node no longer uses up the request budget of your home IP at
     rpc.qubic.org – wallet.qubic.org and the explorer keep working in your network
   - New: shared budget for all calls to public APIs (default 60 per minute,
     adjustable in Admin → Upstream nodes); a "too many requests" answer pauses
     all calls to that service instead of retrying immediately
   - New: further Home Nodes in your network can use this node as their RPC
     upstream (transfers of not yet archived addresses are fetched for them)
   - Fixed: /v1/status reports the real epoch boundaries like rpc.qubic.org

  Version 1.2.10 – privacy mode:
   - New: press ESC to blur all Public IDs, wallet balances and onion addresses
     (great for screenshots or showing your screen) – press ESC again to show them
   - New: privacy mode switch in Settings → Node settings
   - Improved: log lines are only blurred when they contain an ID or onion address

  Version 1.2.9 – much lighter on your computer and phone:
   - Improved: the animated background now uses a fraction of the CPU/GPU –
     no more spinning fans or draining batteries while the dashboard is open
   - Improved: fewer always-running effects on the dashboard, animation
     pauses while the browser tab is in the background
   - Fixed: on phones the "QUBIC HOME NODE" title no longer runs under the
     language switch

  Version 1.2.8 – speaks the same API as the official Qubic services and Bob:
   - New: Bob-compatible JSON-RPC at /qubic (like a real Bob node) – apps
     such as QubicFlow can use your Home Node as their Bob source; transfers
     of watched addresses come from your own archive, beyond Bob's ~14 days
   - New: /live/v1/* paths and pass-throughs for tick data, smart-contract
     queries and the query service – QubicFlow now works fully against the
     Home Node
   - New: add your own Qubic Lite node as an upstream (type LITE) for live
     data such as tick, balances and broadcasts
   - Improved: /status, /balance and /tick now answer in the Bob format
   - Improved: live logs can be paused, scrolled back and copied; long panel
     lists are paged instead of scrolling inside the panel
   - Fixed: event-log fallback returned the wrong format and hid rate limits

  Version 1.2.7 – three new dashboard views to try:
   - New: "Cockpit" tab – a dense, mining-style overview that fits all key
     numbers, upstream nodes, mesh peers, events, transactions, balances,
     epoch archive, apps and the worker log on one screen
   - New: "Network" tab – focused on who is connected to your node: peer
     mesh, transfer-sync lanes (RPC/Bob/Mesh) and connected apps, each with
     a live animation and a detailed list, in the Qubic Report look
   - New: "Topology" tab – a blueprint-style schematic of your node showing
     data sources, mesh peers, apps and the archive with live values on the
     links, plus a parts list
   - The classic dashboard stays the start page; all views work in dark and
     light mode

  Version 1.2.6:
   - New: dashboard now has a "+ Peer" button next to the Tor status chip –
     add a peer's onion address in a quick dialog without leaving the
     dashboard
   - New: Settings' Database panel now also lists the SQLite archive tables
     (transactions, balances, events, epochs, ticks) alongside the node's
     internal collections, so you can see everything that's actually stored
   - Fixed: "Reset database" previously only cleared the node's internal
     collections while leaving the (much larger) archive untouched, and
     incidentally wiped peers and settings too; it now clears the full
     watchlist history including the archive, while peers and your settings
     are kept
   - Improved: Settings page reordered for a clearer flow (node settings,
     worker logs, peers, watchlist, database)

  Version 1.2.5 – self-healing mesh:
   - New: the watchlist now converges across the mesh – nodes adopt
     watched addresses they don't know yet from verified peers, so an
     address added while the mesh was split is picked up automatically
   - New: removing an address also converges – the delete is mirrored to
     the mesh and tombstoned, so it won't "come back to life" from other
     nodes still advertising it (re-adding it explicitly clears this)
   - New: owner-fallback – if the node responsible for an address is
     offline for >15 min or serves stale data, another node syncs it
     itself, so no watched address is ever left empty
   - New: events now travel over the mesh too – nodes without direct Bob
     access inherit the events of Bob-connected nodes, so Bob's ~14-day
     limit no longer caps your archive
   - Improved: a local Tor outage now skips the mesh push cleanly instead
     of penalizing peers with long cooldowns

  Version 1.2.4:
   - New: dashboard stat tiles (peer count, tick lag, vault totals,
     watched addresses) now update live and highlight briefly on change,
     so the node visibly "breathes"
   - New: optional light theme in addition to the dark theme
   - Improved: faster, gentler refresh cadence (base values every 5s,
     full epoch/status stats every 15s) – keeps tiles fresh without
     loading the Raspberry Pi
   - Improved: more robust mutual peer registration and balance/
     transaction sync over the Tor mesh

  Version 1.2.3:
   - Fixed: Tor status on the dashboard now reflects a real SOCKS proxy
     check (cached) instead of a hardcoded/incorrect probe
   - Fixed: newly registered peers now register back with the node that
     found them, so both sides see each other in the mesh immediately
   - New: dashboard shows the node's own onion address
   - New: sync animations only light up when there's real transaction,
     event, or mesh activity instead of always animating

  Version 1.2.2:
   - Changed: web UI port moved from 8080 to 8090 (8080 collided with
     other Umbrel apps such as QubicFlow, blocking installation)
   - New: dashboard is now the start page (with peer-mesh, transfer-sync
     and connected-apps animations), settings page redesigned
   - New: two languages (English/German, selectable in Settings)
   - New: "Auto-watch queried addresses" setting (default on) so external
     apps like QubicFlow automatically fill the archive & event feed

  Version 1.2.1:
   - Fixed: Tor onion address was never created on fresh installs
     ("Permissions on directory ... are too permissive"). The hidden
     service directory is now set to 0700 automatically on startup –
     no manual configuration needed.

  Version 1.2.0 – complete storage overhaul:
   - Renamed: "Qubic LiteNode+" is now "Qubic Home Node" (avoids confusion with
     the official Core Lite Node and Bob Node)
   - .NET 10 (LTS)
   - New epoch-partitioned SQLite archive (one file per Qubic epoch, kept forever)
   - Automatic migration of existing LiteDB data
   - Gap-free windowed history backfill with rate-limit friendly retries
   - RPC-compatible endpoints (/v1, /v2) and Bob-style JSON-RPC (/rpc)
   - Fixed: container healthcheck (wget → curl), health endpoint no longer
     reports unhealthy while peer sync is disabled
   - Fixed: unbounded database growth that could freeze the app on Raspberry Pi
