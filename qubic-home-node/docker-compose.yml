services:
  app_proxy:
    environment:
      APP_HOST: qubic-home-node_edge
      APP_PORT: 8090
      PROXY_AUTH_ADD: "true"
      # Ohne Umbrel-Login erreichbar: RPC-/Bob-kompatible Lese-Endpunkte + Gossip.
      # BEWUSST NICHT mehr /api/* pauschal: die mutierenden Admin-Endpunkte
      # (/api/db/*, /api/settings, …) verlangen jetzt den Umbrel-Login.
      # /api/watched/* und /api/registerPeer bleiben offen (Mesh-Mirroring bzw.
      # gegenseitige Peer-Registrierung über Tor), sind aber im Core zusätzlich
      # per Gossip-Shared-Secret abgesichert. /api/peers ist der Read-only-
      # Peer-Austausch des Meshes (wie in v1.1.6, als /api/* offen war – ohne
      # diese beiden Pfade findet sich das Mesh hinter dem Umbrel-Login nicht).
      PROXY_AUTH_WHITELIST: "/,/api/watched/*,/api/peers,/api/registerPeer,/api/events,/api/events/*,/api/transfers,/api/health,/api/balances,/api/balances/*,/api/ticks,/api/transactions,/swagger/*,/gossip/*,/v1/*,/v2/*,/rpc,/status,/balance/*,/tick/*,/query/*"

  # Einmaliger Init-Container: Docker legt das Tor-Hidden-Service-Verzeichnis
  # beim ersten Start als root:root 0755 an (weil core/ui es bind-mounten, bevor
  # Tor existiert). Tor akzeptiert HiddenServiceDir aber nur mit 0700 und geht
  # sonst in eine Restart-Schleife ("Permissions ... too permissive") – es
  # entsteht nie eine hostname-Datei. Deshalb hier vor allem anderen chmod 700.
  qubic-home-node_tor_perms:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command: sh -c "chmod 700 /tor-host"
    volumes:
      - /home/umbrel/umbrel/tor/data/app-qubic-home-node:/tor-host

  qubic-home-node_edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [qubic-home-node_ui, qubic-home-node_core]
    volumes:
      - ${APP_DATA_DIR}/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      umbrel_main_network:
        aliases:
          - qubic-home-node_edge   # <— wichtiger Alias für app_proxy
      default: {}

  qubic-home-node_core:
    image: andyqus/qubic-home-node:core-v1.2.7
    restart: unless-stopped
    depends_on:
      qubic-home-node_tor_perms:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:9090
      - ASPNETCORE_ENVIRONMENT=Production
      # WICHTIG: so heißt der Tor-Service in Umbrel
      - TorProxy=socks5://tor_proxy:9050
      - ASPNETCORE_DATAPROTECTION__KEYRING__PATH=/app/data/keys
      - ASPNETCORE_DATAPROTECTION__APPLICATIONNAME=QubicHomeNode-Core
      - DATA_DIR=/app/data
      - OnionHostnamePath=/tor-host/hostname
      # Netzwerkweiter Pre-Shared-Key des Home Node-Meshes:
      # MUSS auf allen Peers identisch sein, sonst verwerfen sie gegenseitig ihre Gossip-Digests.
      - GOSSIP_SHARED_SECRET=mysecret_b3d958e5-d3b7-4b47-a8ef-13e67fd07f85
      - GOSSIP_ALLOW_UNVERIFIED=false
      - WATCH_MIRROR_TO_ALL=true
      # Archiv-Einstellungen:
      # 0 = ALLES behalten (Archiv-Modus, Default). N = nur die letzten N Epochen-Shards behalten.
      - ARCHIVE_RETENTION_EPOCHS=0
      # Tick-Fenstergröße für den lückenlosen Backfill (Default 5000000)
      # - ARCHIVE_BACKFILL_WINDOW=5000000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=localhost,127.0.0.1,::1,.onion
    volumes:
      - ${APP_DATA_DIR}/core-data:/app/data
      # Umbrel legt die Hidden-Service-Daten der App hier ab (Pfad ist Umbrel-spezifisch)
      - /home/umbrel/umbrel/tor/data/app-qubic-home-node:/tor-host:ro
    healthcheck:
      # curl statt wget: das aspnet-Debian-Image enthält kein wget (Healthcheck schlug immer fehl!)
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    networks:
      - default
      - umbrel_main_network      # WICHTIG!

  qubic-home-node_ui:
    image: andyqus/qubic-home-node:ui-v1.2.7
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_DATAPROTECTION__KEYRING__PATH=/app/data/keys
      - ASPNETCORE_DATAPROTECTION__APPLICATIONNAME=QubicHomeNode-UI
      - ASPNETCORE_URLS=http://0.0.0.0:8090
      - CORE_API_URL=http://qubic-home-node_core:9090
      - OnionHostnamePath=/tor-host/hostname
      - DATA_DIR=/app/data
    volumes:
      - ${APP_DATA_DIR}/ui-data:/app/data
      - /home/umbrel/umbrel/tor/data/app-qubic-home-node:/tor-host:ro
    depends_on: [qubic-home-node_core]
    networks:
      - default
      - umbrel_main_network      # optional

networks:
  # ❌ KEIN external für default – Umbrel erzeugt das default-Netz selbst.
  # ✅ Nur das Umbrel-Main-Netz als external anhängen:
  umbrel_main_network:
    external: true
