description: |-
  A lightweight personal archive node for the Qubic network.

  Public Qubic infrastructure keeps history only for a limited time
  (Bob nodes: ~14 days). Qubic Home Node continuously collects the
  transactions and balances of the addresses you watch and stores them
  permanently on your own device – partitioned into one immutable
  database file per Qubic epoch, just like the Bitcoin node stores
  its block files.

  ⚡ Features:
   - Permanent, epoch-partitioned archive (SQLite, one file per epoch)
   - Complete, gap-free history backfill via the public Qubic RPC
   - Balance history (append-only) in addition to current balances
   - RPC-compatible API: /v1/tick-info, /v1/balances, /v2/identities/{id}/transfers,
     /v1/broadcast-transaction – other apps can use your node like rpc.qubic.org
   - Bob-style JSON-RPC 2.0 endpoint (/rpc) and REST (/status, /balance, /tick)
   - Peer-to-peer sync between Home Nodes over Tor (gossip + sharding)
   - Dashboard with live worker logs

